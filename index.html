<style>
:root{--bg:#061018;--surface:#0c1c28;--fg:#e6f2f6;--muted:#8aa3b3;--primary:#2fbf9a;--ink:#04241c;--border:#1a3344;--live:#c44747}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--fg)}
body{margin:0;min-height:100dvh;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:active{transform:scale(.96)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
a{color:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(6,16,24,.92);border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}
.bar{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{font-weight:500;letter-spacing:.14em;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo{width:28px;height:28px;flex:none}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button, .langs button{min-height:44px;background:transparent;border:0;color:var(--muted);padding:0 10px}
nav button.on, .langs button.on{color:var(--primary)}
.langs{margin-left:auto;display:flex;gap:4px}
main{max-width:1100px;margin:0 auto;padding:28px 16px 80px}
h1{font-weight:500;letter-spacing:.08em;font-size:clamp(2rem,6vw,3.4rem);margin:12px 0}
h2{font-weight:500;font-size:1.35rem;margin:0}
.kicker{color:var(--primary);letter-spacing:.16em;text-transform:uppercase;font-size:.75rem;font-weight:500}
.muted{color:var(--muted)}
.serif{font-family:"Source Serif 4",Georgia,serif}
.card{border:1px solid var(--border);background:var(--surface);padding:20px;margin-top:16px}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px}
.grow{flex:1}
.btn{min-height:48px;padding:0 18px;border:0;background:var(--primary);color:var(--ink);font-weight:500}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--border)}
.btn.live{background:var(--live);color:#fff}
label{display:block;font-size:.9rem;color:var(--muted);margin-top:12px}
input,textarea,select{width:100%;margin-top:6px;min-height:48px;background:var(--bg);border:1px solid var(--border);padding:8px 12px}
textarea{min-height:96px;resize:vertical}
.cols{display:grid;gap:12px}
@media(min-width:900px){.cols{grid-template-columns:repeat(3,1fr)}}
.decision{border:4px solid var(--primary);background:var(--bg);padding:14px;margin-top:14px}
.meter{height:8px;background:var(--bg);margin-top:8px}
.meter>span{display:block;height:100%;background:var(--primary);transition:width .7s ease}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#02080c;padding:8px;min-height:220px}
.tile{background:#0a1822;display:flex;align-items:flex-end;padding:10px;min-height:100px;position:relative}
.dot{width:8px;height:8px;border-radius:50%;background:var(--primary);display:inline-block;animation:pulse 2.4s ease-in-out infinite}
.dot.off{background:var(--muted);animation:none}
@keyframes pulse{50%{opacity:.45}}
@keyframes rise{from{opacity:0;filter:blur(4px);transform:translateY(12px)}to{opacity:1;filter:none;transform:none}}
.rise{animation:rise .52s cubic-bezier(.2,0,0,1) both}
.d2{animation-delay:.09s}.d3{animation-delay:.18s}.d4{animation-delay:.27s}
.toast{position:fixed;left:16px;right:16px;bottom:16px;z-index:40;max-width:32rem;margin:0 auto;border:2px solid var(--primary);background:var(--surface);padding:16px;animation:rise .42s ease-out}
.dock{position:fixed;right:16px;bottom:16px;z-index:30;width:min(360px,calc(100% - 32px));border:1px solid var(--border);background:var(--surface);padding:12px}
.note{font-size:.75rem;color:var(--muted);margin-top:8px}
video.cam{width:100%;height:140px;background:#02080c;object-fit:cover}
.lock{width:14px;height:14px;vertical-align:-2px}
@media(prefers-reduced-motion:reduce){.rise,.toast,.dot,.meter>span{animation:none;transition:none}}
</style>

function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const data = JSON.parse(raw); data.call = null; return data; } }catch(e){}
  return seed();
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }
function t(k){ return T[db.locale][k]; }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => "&#"+c.charCodeAt(0)+";"); }

function money(n){ return "$"+Number(n).toLocaleString("en-US"); }
function deeds(){ return db.personal + (db.awarded?10:0); }
function rate(){ return (1.25 + deeds()*0.01); }
function cap(){ return Math.round(1000000*rate()); }

function startBar(done){
  let p=0; const timer=setInterval(()=>{ p+=10; const bar=document.getElementById("bar"); if(bar) bar.style.width=Math.min(p,100)+"%"; if(p>=100){ clearInterval(timer); done(); } }, 80);
}
document.body.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]");
  if(!b) return;
  if(b.tagName==="A") ev.preventDefault();
  const act = b.dataset.act;
  if(act==="goto"){ db.view=b.dataset.view; save(); render(); }
  else if(act==="lang"){ db.locale=b.dataset.code; save(); render(); }
  else if(act==="kind"){ db.kind=b.dataset.kind; const k=document.getElementById("kind"); if(k) k.textContent=db.kind+" "+(db.fileName||""); }
  else if(act==="fund-open"){ db.fundOpen=!db.fundOpen; render(); }
  else if(act==="fund"){
    const n=+b.dataset.n; const d=db.drives[0]; d.raised+=n; d.backers+=1; d.ledger.unshift(n); db.personal+=n; db.fundOpen=false; save(); render();
  }
  else if(act==="pick"){ db.surveys[0].picked=+b.dataset.i; render(); }
  else if(act==="step"){
    const s=db.surveys[0]; if(s.picked==null) return; s.answers[s.step]=s.picked; s.picked=null;
    if(s.step<s.qs.length-1){ s.step++; save(); render(); return; }
    s.done=true;
    const a=s.answers[0], c=s.qs[2]&&s.qs[2].cross?s.answers[2]:a;
    s.conflict = s.qs[2] && s.qs[2].cross && a!==c;
    if(!s.conflict && !db.awarded){ db.awarded=true; db.iq+=10; toast(t("award")); }
    else { save(); render(); }
  }
  else if(act==="tip-open"){ db.tipFor = db.tipFor===b.dataset.name ? "" : b.dataset.name; render(); }
  else if(act==="tip"){
    const n=+b.dataset.n; if(db.iq<n){ toast(t("iqShort")); return; }
    db.iq-=n; db.tipFor=""; toast(t("iqSent").replace("{n}", n));
  }
  else if(act==="group"){ db.groupId=b.dataset.id; save(); render(); }
  else if(act==="golive"){ const g=db.groups.find(x=>x.id===db.groupId); if(!g) return; g.live=true; db.liveId=g.id; save(); startP2P("video", g.name); }
  else if(act==="leave"){ hangP2P(); db.call=null; db.liveId=null; save(); render(); }
  else if(act==="live-topic"){ db.view="groups"; db.liveId=db.groupId; const g=db.groups.find(x=>x.id===db.groupId); if(g) g.live=true; save(); render(); }
  else if(act==="write"){
    const name=b.dataset.name; let th=db.threads.find(x=>x.with===name);
    if(!th){ th={id:uid(), with:name, messages:[]}; db.threads.unshift(th); }
    db.threadId=th.id; db.view="messages"; save(); render();
  }
  else if(act==="thread"){ db.threadId=b.dataset.id; save(); render(); }
  else if(act==="call"){ const th=db.threads.find(x=>x.id===db.threadId); startP2P(b.dataset.mode, th?th.with:""); }
  else if(act==="cmic"){ if(db.call){ db.call.mic=!db.call.mic; setKind("audio", db.call.mic); } render(); }
  else if(act==="ccam"){ if(db.call){ db.call.cam=!db.call.cam; setKind("video", db.call.cam); } render(); }
  else if(act==="copy-sdp"){ copySdp(); }
  else if(act==="join-sdp"){ joinP2P(); }
  else if(act==="hang"){ hangP2P(); db.call=null; save(); render(); }
  else if(act==="approve"){ const item=db.pending.find(x=>x.id===b.dataset.id); db.pending=db.pending.filter(x=>x.id!==b.dataset.id); if(item) db.posts.unshift({id:uid(), sphere:"nature", title:item.title, body:item.body, decision:t("decision"), author:"member"}); save(); render(); }
  else if(act==="reject"){ db.pending=db.pending.filter(x=>x.id!==b.dataset.id); save(); render(); }
  else if(act==="pubq"){
    if(db.draftQ.length<1) return;
    db.surveys.unshift({id:uid(), title:db.draftTitle||"Survey", qs:db.draftQ.slice(0,15), step:0, answers:[], done:false, conflict:false});
    db.draftQ=[]; db.draftTitle=""; db.view="feed"; save(); render();
  }
});
render();
let pc = null, localStream = null, remoteStream = null;
function waitIce(conn){
  if(conn.iceGatheringState==="complete") return Promise.resolve();
  return new Promise(resolve => {
    function done(){ if(conn.iceGatheringState==="complete"){ conn.removeEventListener("icegatheringstatechange", done); resolve(); } }
    conn.addEventListener("icegatheringstatechange", done);
  });
}
function makePc(){
  const conn = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
  remoteStream = new MediaStream();
  conn.ontrack = ev => {
    ev.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
    const video = document.getElementById("remote-video");
    if(video) video.srcObject = remoteStream;
  };
  conn.onconnectionstatechange = () => {
    if(db.call && (conn.connectionState==="connected" || conn.connectionState==="connecting")) db.call.state = "linked";
  };
  return conn;
}
function bindMedia(){
  const local = document.getElementById("local-video");
  const remote = document.getElementById("remote-video");
  if(local && localStream) local.srcObject = localStream;
  if(remote && remoteStream) remote.srcObject = remoteStream;
}
function setKind(kind, on){
  if(!localStream) return;
  localStream.getTracks().filter(track => track.kind===kind).forEach(track => { track.enabled = on; });
}
function hangP2P(){
  if(pc){ pc.close(); pc = null; }
  if(localStream){ localStream.getTracks().forEach(track => track.stop()); localStream = null; }
  remoteStream = null;
}
async function startP2P(mode, who){
  try{
    hangP2P();
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: mode==="video" });
    pc = makePc();
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitIce(pc);
    db.call = { with: who, mode: mode, mic: true, cam: mode==="video", role: "offer", state: "offer", sdp: JSON.stringify(pc.localDescription) };
    save(); render();
  }catch(err){ hangP2P(); db.call = null; toast(t("callFail")); }
}
function copySdp(){
  const box = document.getElementById("sdp-out");
  const text = box ? box.value : "";
  if(!text){ toast(t("callFail")); return; }
  function mark(){ toast(t("copied")); }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(mark).catch(function(){ selectSdp(box); mark(); });
    return;
  }
  selectSdp(box);
  mark();
}
function selectSdp(box){
  box.removeAttribute("readonly");
  box.focus();
  box.select();
  try{ document.execCommand("copy"); }catch(e){}
  box.setAttribute("readonly", "");
}
async function joinP2P(){
  const box = document.getElementById("sdp-in");
  let desc;
  try{ desc = JSON.parse((box && box.value) || ""); }
  catch(e){ toast(t("callFail")); return; }
  if(!desc || !desc.type || !desc.sdp){ toast(t("callFail")); return; }
  try{
    if(!pc){
      const mode = desc.sdp.indexOf("m=video")>=0 ? "video" : "audio";
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: mode==="video" });
      pc = makePc();
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      await pc.setRemoteDescription(desc);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await waitIce(pc);
      db.call = { with: (db.call && db.call.with) || "", mode: mode, mic: true, cam: mode==="video", role: "answer", state: "answer", sdp: JSON.stringify(pc.localDescription) };
      save(); render();
      return;
    }
    await pc.setRemoteDescription(desc);
    if(db.call) db.call.state = "linked";
    save(); render();
  }catch(err){ toast(t("callFail")); }
}
<script>
// 1. Принудительный безопасный протокол HTTPS
if (window.location.protocol === 'http:' && !window.location.host.includes('localhost')) {
    window.location.protocol = 'https:';
}

// 2. Безопасный замок без автоматического вмешательства в верстку
document.addEventListener("DOMContentLoaded", function() {
    
    // Функция, которая сработает только после правильного ввода пароля
    function checkAdminAccess() {
        var value = window.prompt("Введите секретный ключ администратора:");
        if (value === 'putsa') {
            localStorage.setItem('site_owner_access', 'true');
            alert("Доступ активирован!");
            
            // Пытаемся найти админку по разным возможным именам в коде
            var myPanel = document.getElementById('admin-panel') || document.querySelector('.admin-panel') || document.querySelector('[id*="admin"]');
            if (myPanel) {
                myPanel.style.display = 'block';
            } else {
                alert("Система защиты активирована, но сам блок панели модератора не найден. Проверьте его ID.");
            }
        } else if (value !== null) {
            alert("Неверный ключ доступа.");
        }
    }

    // ТРИГГЕР 1 (Для компьютера): Ввод слова putsa на клавиатуре
    var word = 'putsa';
    var buffer = '';
    document.addEventListener("keydown", function (ev) {
        if (ev.ctrlKey || ev.metaKey || ev.altKey || !ev.key || ev.key.length !== 1) return;
        buffer = (buffer + ev.key.toLowerCase()).slice(-word.length);
        if (buffer === word) {
            buffer = "";
            checkAdminAccess();
        }
    });

    // ТРИГГЕР 2 (Для планшета): 3 быстрых тапа в любом месте экрана
    var mobileTaps = [];
    document.addEventListener("pointerup", function () {
        var now = Date.now();
        mobileTaps.push(now);
        mobileTaps = mobileTaps.filter(function (t) { return now - t <= 600; });
        if (mobileTaps.length >= 3) {
            mobileTaps = [];
            checkAdminAccess();
        }
    });
});
</script>
